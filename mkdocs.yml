site_name: Administración de Bases de Datos y Almacenamiento en la Nube
site_url: https://d-ortegaparrilla.github.io/abdan26-27/
site_description: Apuntes del módulo de Administración de Bases de Datos y Almacenamiento en la Nube (ABDAN) - CE Recursos y Servicios en la Nube
site_author: David Ortega Parrilla
repo_name: d-ortegaparrilla/abdan26-27
repo_url: https://github.com/d-ortegaparrilla/abdan26-27

use_directory_urls: false

theme:
  name: material
  language: es
  favicon: favicon.png
  logo: favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: red
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: red
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

extra:
  search:
    language: "es"

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: es
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: "index.md"
  - Planificación del Módulo: "planificacion.md"
  - UT1. Almacenamiento de Objetos en la Nube (Amazon S3):
    - "1. Introducción al Almacenamiento en la Nube": "UT1/01-introduccion.md"
    - "2. Arquitectura y Componentes de Amazon S3": "UT1/02-arquitectura-s3.md"
    - "3. Clases de Almacenamiento y S3 Glacier": "UT1/03-clases-almacenamiento.md"
    - Prácticas de Laboratorio:
      - "Práctica 1.1: Operaciones básicas con Amazon S3": "UT1/practicas/practica-1-operaciones-basicas.md"
#   Descomentar progresivamente en próximas sesiones:
#   - "4. Ciclo de Vida, Versionado e Inmutabilidad": "UT1/04-ciclo-de-vida-versionado.md"
#   - "5. Seguridad, Control de Acceso y Cifrado": "UT1/05-seguridad-control-acceso.md"
#   - "6. Alojamiento de Sitios Web Estáticos": "UT1/06-sitios-web-estaticos.md"
#   - "7. Replicación y Transferencia en S3": "UT1/07-replicacion-movimiento-datos.md"
